    <style>
        /* DESIGN SYSTEM: PINK MATHEMATICAL GEOMETRIC */
        :root {
            --bg-main: #fff0f3;       /* Softest Pink */
            --bg-alt: #ffccd5;        /* Sakura Blush */
            --bg-card: rgba(255, 255, 255, 0.85);
            --accent: #ff4d6d;        /* Rose Pink */
            --accent-subtle: #c9184a;  /* Deep Wine/Crimson */
            --text-main: #590d22;      /* Deep Wine Text */
            --text-muted: #800f2f;
            --border: rgba(255, 77, 109, 0.25);
            --border-hover: #ff4d6d;
            --glow: rgba(255, 77, 109, 0.12);
        }

        /* RESET & BASE */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        /* BACKGROUND ELEMENTS */
        .math-bg-grid {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255, 77, 109, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 77, 109, 0.08) 1px, transparent 1px);
            background-size: 45px 45px;
            z-index: -2;
        }

        .floating-shapes {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none;
        }

        .shape {
            position: absolute;
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.4), rgba(255, 77, 109, 0.15));
            border-radius: 50%;
            filter: blur(60px);
            animation: floatingEffect 20s infinite alternate ease-in-out;
        }

        .shape-1 { width: 400px; height: 400px; top: -10%; left: -5%; }
        .shape-2 { width: 500px; height: 500px; bottom: -10%; right: -5%; animation-delay: -5s; }

        @keyframes floatingEffect {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(60px, 40px) scale(1.1); }
        }

        /* TYPOGRAPHY */
        h1, h2, h3, .logo { font-family: 'Space Grotesk', sans-serif; font-weight: 700; }
        .greeting { font-family: 'Playfair Display', serif; font-style: italic; }
        .code-font { font-family: 'Fira Code', monospace; }

        /* LAYOUT COMPONENTS */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        .section { padding: 100px 0; }
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 40px; }
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; }

        /* NAVBAR */
        .navbar {
            background: rgba(255, 240, 243, 0.85);
            backdrop-filter: blur(20px);
            position: fixed; top: 0; width: 100%; z-index: 1000;
            border-bottom: 1px solid var(--border);
        }

        .nav-container {
            max-width: 1200px; margin: 0 auto; padding: 18px 24px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .logo { color: var(--accent-subtle); text-decoration: none; font-size: 1.1rem; letter-spacing: 1px; }
        .nav-links { display: flex; list-style: none; gap: 30px; }
        .nav-links a { text-decoration: none; color: var(--text-muted); font-weight: 600; font-size: 0.95rem; transition: color 0.3s; }
        .nav-links a:hover { color: var(--accent); }

        /* HERO SECTION */
        .hero {
            min-height: 100vh; display: flex; align-items: center;
            background: radial-gradient(circle at 85% 30%, #ffccd5 0%, transparent 45%);
            padding-top: 80px;
        }

        .hero h1 { font-size: clamp(3rem, 8vw, 5.5rem); color: var(--text-main); margin-bottom: 25px; line-height: 1.1; }
        .hero .greeting { font-size: 1.8rem; color: var(--accent); margin-bottom: 10px; display: block; }
        .tagline { 
            font-size: 1.25rem; color: var(--text-muted); margin-bottom: 45px; 
            max-width: 700px; border-left: 5px solid var(--accent); padding-left: 20px;
        }

        .btn {
            padding: 16px 38px; border-radius: 50px; text-decoration: none; font-weight: 700;
            display: inline-flex; align-items: center; gap: 12px; transition: 0.4s;
        }
